[package]
name = "http-test-target"
version = "0.1.0"
edition = "2021"

[dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[profile.release]
opt-level = 3
lto = false
strip = true
