global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  10s
    timeout server  10s

frontend http_in
    bind *:80
    default_backend origin

# HAProxy's HTTP/1.1 validator sits in front of nginx. Anything HAProxy
# rejects never reaches the backend; anything it forwards, nginx then
# also has a chance to handle.
backend origin
    server origin1 nginx:80
