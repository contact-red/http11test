events {
  worker_connections 1024;
}

http {
  # Log to stdout/stderr so docker logs show useful diagnostics.
  access_log /dev/stdout;
  error_log /dev/stderr info;

  # Sensible defaults for a conformance test target.
  server_tokens off;
  default_type text/plain;

  # Default buffers are intentionally not tuned upward. Tests expect:
  # - large_client_header_buffers default (4 8k on alpine) drives the
  #   request-line / header-size limits we probe.
  # - client_header_buffer_size default (1k) limits per-line header size.

  server {
    listen 80 default_server;
    server_name _;

    location / {
      # Plain 200 for the root path lets the leading-CRLF accept test pass.
      return 200 "ok\n";
    }
  }
}
